<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C1C1C"/>
      <stop offset="0.55" stop-color="#5a4520"/>
      <stop offset="1" stop-color="#C89B3C"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C89B3C" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E8C16A" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="240" rx="14"/></clipPath>
    <style>
      .w1{animation:m 9s linear infinite}
      .w2{animation:m 14s linear infinite reverse}
      @keyframes m{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;animation:f 1.4s ease-out both}
      .s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#E8C16A;animation:f 1.4s .4s ease-out both}
      @keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="240" fill="url(#g)"/>
    <g class="w1">
      <path fill="url(#w)" d="M0 180 C150 150 300 210 450 180 C600 150 750 210 900 180 C1050 150 1200 210 1350 180 C1500 150 1650 210 1800 180 C1950 150 2100 210 2250 180 C2325 165 2400 180 2400 180 L2400 240 L0 240 Z"/>
    </g>
    <g class="w2">
      <path fill="#C89B3C" fill-opacity="0.35" d="M0 205 C200 185 400 225 600 205 C800 185 1000 225 1200 205 C1400 185 1600 225 1800 205 C2000 185 2200 225 2400 205 L2400 240 L0 240 Z"/>
    </g>
    <text class="t" x="600" y="108" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="1">Yassine Lahssini</text>
    <text class="s" x="600" y="148" text-anchor="middle" font-size="22" font-weight="500" letter-spacing="2">Computer Engineering · Big Data &amp; AI</text>
  </g>
</svg>
